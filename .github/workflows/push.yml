# This workflow runs on every push.

name: Push checks

on:
  push:
  workflow_dispatch:


# If a run is in progress and a push happens, the old run is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 15

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: .NET setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Update dependency graph image
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dependency graph image
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          cd CopProject/DependencyGraph
          dotnet run --file graph.cs > graph.mmd
          npx --yes @mermaid-js/mermaid-cli -i graph.mmd -o DependencyGraph.png
          rm graph.mmd
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CopProject/DependencyGraph/DependencyGraph.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: update dependency graph [skip ci]"
            git push
          fi

      - name: Restore dotnet projects
        run: dotnet restore CopProject

      - name: Build dotnet projects
        run: dotnet build CopProject --configuration Release --no-restore

      - name: Test dotnet projects
        # env:
        #   COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: dotnet test CopProject --configuration Release --no-build --verbosity normal



# This workflow runs on every push.

name: Push checks

on:
  push:
  workflow_dispatch:


# If a run is in progress and a push happens, the old run is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 15

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: .NET setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dotnet projects
        run: dotnet restore CopProject

      - name: Build dotnet projects
        run: dotnet build CopProject --configuration Release --no-restore

      - name: Test dotnet projects
        # env:
        #   COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: >
          dotnet test CopProject --configuration Release --no-build --verbosity normal
          --logger "trx"
          --results-directory ./test-results

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests (.NET)
          path: 'test-results/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload unit test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ github.sha }}
          path: test-results/
          retention-days: 60

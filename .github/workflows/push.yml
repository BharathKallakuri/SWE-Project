# This workflow runs on every push.

name: Push checks

on:
  push:
  workflow_dispatch:


# If a run is in progress and a push happens, the old run is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: .NET setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dotnet projects
        run: dotnet restore CopProject

      - name: Build dotnet projects
        run: dotnet build CopProject --configuration Release --no-restore

      - name: Test dotnet projects
        run: dotnet test CopProject --configuration Release --no-build --verbosity normal



# This workflow runs on every pull request created to main.

name: Line and branch coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  # These variables are set to 80 as fallback, if their corresponding
  # environment variables are undefined.
  LINE_COVERAGE_THRESHOLD: ${{ vars.LINE_COVERAGE_THRESHOLD || '80' }}
  BRANCH_COVERAGE_THRESHOLD: ${{ vars.BRANCH_COVERAGE_THRESHOLD || '80' }}

jobs:
  build-test-coverage:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 20

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: .NET setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dotnet projects
        run: dotnet restore CopProject

      - name: Build dotnet projects
        run: dotnet build CopProject --configuration Release --no-restore

      - name: Test dotnet projects with coverage
        env:
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: >
          dotnet test CopProject --configuration Release --no-build
          --settings CopProject/ci.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx"
          --results-directory ./coverage

      # Publishes interactive test report in GitHub Checks showing which tests passed or failed
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests (.NET)
          path: 'coverage/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      # Upload raw TRX test results as an artifact
      - name: Upload unit test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-pr-${{ github.event.pull_request.number || github.run_id }}
          path: coverage/
          retention-days: 60

      - name: Install ReportGenerator
        # run: dotnet tool install --global dotnet-reportgenerator-globaltool
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate coverage and code quality report
        run: >
          reportgenerator
          -reports:"coverage/**/coverage.cobertura.xml"
          -targetdir:"coverage-report"
          -reporttypes:"Html;MarkdownSummaryGithub;JsonSummary"

      - name: Add summary to the run page
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Upload full HTML coverage & cyclomatic complexity report artifact
      - name: Upload HTML report
        id: upload-html
        uses: actions/upload-artifact@v7
        with:
          name: code-quality-and-coverage-report-pr-${{ github.event.pull_request.number || github.run_id }}
          path: coverage-report/
          retention-days: 60

      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HTML_URL: ${{ steps.upload-html.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "<!-- coverage-report -->"
            echo "## Code Coverage & Quality Report"
            echo
            cat coverage-report/SummaryGithub.md
            echo
            echo "**Full HTML report (Coverage & Cyclomatic Complexity):** [download artifact (zip)]($HTML_URL)"
            echo
            echo "*To see **which tests passed or failed**, view the [Checks tab](https://github.com/${{ github.repository }}/pull/$PR_NUMBER/checks) on this PR.*"
          } > comment.md

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --jq '.[] | select(.body | contains("<!-- coverage-report -->")) | .id' | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -X PATCH -F body=@comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file comment.md
          fi

      - name: Enforce line coverage threshold
        run: |
          COVERAGE=$(jq '.summary.linecoverage' coverage-report/Summary.json)
          echo "Line coverage: ${COVERAGE}% (required: ${LINE_COVERAGE_THRESHOLD}%)"
          if ! awk -v c="$COVERAGE" -v t="$LINE_COVERAGE_THRESHOLD" 'BEGIN { exit !(c >= t) }'; then
            echo "Line coverage threshold error: ${COVERAGE}% is below the required ${LINE_COVERAGE_THRESHOLD}%"
            exit 1
          fi

      - name: Enforce branch coverage threshold
        run: |
          COVERAGE=$(jq '.summary.branchcoverage' coverage-report/Summary.json)
          echo "Branch coverage: ${COVERAGE}% (required: ${BRANCH_COVERAGE_THRESHOLD}%)"
          if ! awk -v c="$COVERAGE" -v t="$BRANCH_COVERAGE_THRESHOLD" 'BEGIN { exit !(c >= t) }'; then
            echo "Branch coverage threshold error: ${COVERAGE}% is below the required ${BRANCH_COVERAGE_THRESHOLD}%"
            exit 1
          fi
